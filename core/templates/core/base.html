<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}7LineUP{% endblock %}</title>
    <style>
        :root {
            --neon-blue: #00ffff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff00;
            --dark-bg: #0a0a0a;
            --darker-bg: #050505;
            --text-light: #e0e0e0;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: var(--darker-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 5px var(--neon-blue);
            color: var(--neon-blue);
        }
        nav {
            background-color: var(--darker-bg);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        nav a {
            color: var(--text-light);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        nav a:hover {
            background-color: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 5px var(--neon-blue);
            transform: translateY(-2px);
        }
        nav a.active {
            background-color: var(--neon-pink);
            color: var(--dark-bg);
            box-shadow: 0 0 5px var(--neon-pink);
        }
        .content {
            min-height: calc(100vh - 200px);
        }
        .card {
            background-color: var(--darker-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .card h2 {
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            margin-top: 0;
        }
        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        form input, form textarea, form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: var(--dark-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 5px;
            color: var(--text-light);
            font-size: 1rem;
        }
        form textarea {
            height: 100px;
            resize: vertical;
        }
        form button, .btn {
            background-color: var(--neon-blue);
            color: var(--dark-bg);
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--neon-blue);
        }
        form button:hover, .btn:hover {
            background-color: var(--neon-pink);
            color: var(--dark-bg);
            box-shadow: 0 0 5px var(--neon-pink);
            transform: translateY(-2px);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
        }
        .btn-outline:hover {
            background-color: var(--neon-blue);
            color: var(--dark-bg);
        }
        .btn-danger {
            background-color: #ff0000;
        }
        .btn-danger:hover {
            background-color: #ff3333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--neon-blue);
        }
        th {
            background-color: var(--darker-bg);
            color: var(--neon-blue);
            font-weight: bold;
        }
        tr:hover {
            background-color: var(--dark-bg);
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .flash-messages .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease;
        }
        .flash-messages .success {
            background-color: rgba(0, 255, 0, 0.2);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }
        .flash-messages .error {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        footer {
            background-color: var(--darker-bg);
            text-align: center;
            padding: 20px;
            border-top: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            margin-top: auto;
        }
        footer p {
            margin: 0;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            flex: 1;
            background-color: var(--darker-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }
        .stat-card h3 {
            color: var(--neon-pink);
            margin: 0 0 10px 0;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <header>
        <h1>7LineUP Esports Management</h1>
        <p>Neon-themed esports team and match management system</p>
    </header>
    <nav>
        <a href="{% url 'index' %}" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
        <a href="{% url 'member_list' %}" {% if request.path == '/members/' %}class="active"{% endif %}>Members</a>
        <a href="{% url 'team_list' %}" {% if request.path == '/teams/' %}class="active"{% endif %}>Teams</a>
        <a href="{% url 'match_list' %}" {% if request.path == '/matches/' %}class="active"{% endif %}>Matches</a>
    </nav>
    <div class="container">
        <div class="content">
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
    </div>
    <footer>
        <p>&copy; 2026 7LineUP. All rights reserved.</p>
    </footer>
</body>
</html>

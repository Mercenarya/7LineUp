{% extends "core/base.html" %}

{% block title %}{% if member %}Edit Member{% else %}Add Member{% endif %} - 7LineUP{% endblock %}

{% block content %}
<div class="card">
    <h2>{% if member %}Edit Member{% else %}Add New Member{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ member.name }}" required>
        </div>
        <div>
            <label for="ingame">In-Game Name:</label>
            <input type="text" id="ingame" name="ingame" value="{{ member.ingame }}">
        </div>
        <div>
            <label for="role">Role:</label>
            <input type="text" id="role" name="role" value="{{ member.role }}">
        </div>
        <div>
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes">{{ member.notes }}</textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn">{% if member %}Update{% else %}Add{% endif %}</button>
            <a href="{% url 'member_list' %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
